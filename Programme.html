<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Sehha — Programme</title>
<meta name="viewport" content="width=1440" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="app/tailwind-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app/styles.css">
</head>
<body class="min-w-[1440px]">

<div class="flex min-h-screen">
  <div id="chrome"></div>

  <main id="main" class="flex-1 min-w-0">
    <div class="px-7 py-6 space-y-6">

      <!-- header -->
      <div class="flex items-end justify-between">
        <div>
          <div class="text-[11px] uppercase tracking-[0.14em] text-ink-500 font-semibold mb-1.5" id="pgSection">Programme</div>
          <h1 class="text-[26px] font-bold tracking-tight text-ink-900 leading-tight" id="pgTitle">Programme</h1>
          <p class="text-[13.5px] text-ink-600 mt-1" id="pgSubtitle">—</p>
        </div>
        <div class="flex items-center gap-2">
          <button data-toast="Filtre appliqué" class="h-10 px-3.5 rounded-xl border border-ink-200 text-[12.5px] font-semibold text-ink-700 flex items-center gap-2 hover:bg-ink-50 bg-white">
            <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.5V19l4 2v-8.5L22 3z"/></svg>
            Filtrer
          </button>
          <button data-toast="Export PDF généré" class="h-10 px-3.5 rounded-xl border border-ink-200 text-[12.5px] font-semibold text-ink-700 flex items-center gap-2 hover:bg-ink-50 bg-white">
            <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
            Exporter
          </button>
          <button data-toast="Nouvelle saisie ouverte" class="h-10 px-3.5 rounded-xl bg-mint-700 text-white text-[12.5px] font-semibold flex items-center gap-2 hover:bg-mint-800">
            <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Nouvelle saisie
          </button>
        </div>
      </div>

      <!-- KPIs -->
      <div class="grid grid-cols-4 gap-5" id="pgKpis"></div>

      <!-- Area + donut -->
      <div class="grid grid-cols-12 gap-5">
        <div class="col-span-8 bg-white rounded-2xl border border-ink-200 shadow-card p-5">
          <div class="flex items-start justify-between mb-4">
            <div>
              <h3 class="text-[15px] font-bold text-ink-900" id="trendTitle">Tendance sur 12 mois</h3>
              <p class="text-[11.5px] text-ink-500 mt-0.5" id="trendSubtitle">—</p>
            </div>
            <div class="flex p-1 bg-ink-50 rounded-xl border border-ink-200" data-seg-group>
              <button class="seg-btn is-active">12 mois</button>
              <button class="seg-btn">6 mois</button>
              <button class="seg-btn">3 mois</button>
            </div>
          </div>
          <svg viewBox="0 0 720 240" class="w-full h-[240px]">
            <defs><linearGradient id="aP" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3A8C61" stop-opacity="0.32"/><stop offset="1" stop-color="#3A8C61" stop-opacity="0"/></linearGradient></defs>
            <g stroke="#EEF2F0" stroke-width="1"><line x1="40" y1="40" x2="700" y2="40"/><line x1="40" y1="90" x2="700" y2="90"/><line x1="40" y1="140" x2="700" y2="140"/><line x1="40" y1="190" x2="700" y2="190"/></g>
            <g fill="#94A09A" font-size="10" font-family="JetBrains Mono"><text x="32" y="44" text-anchor="end">100</text><text x="32" y="94" text-anchor="end">75</text><text x="32" y="144" text-anchor="end">50</text><text x="32" y="194" text-anchor="end">25</text></g>
            <path d="M40,140 L95,128 L150,135 L205,120 L260,128 L315,108 L370,118 L425,95 L480,108 L535,82 L590,98 L645,72 L700,88 L700,190 L40,190 Z" fill="url(#aP)"/>
            <path d="M40,140 L95,128 L150,135 L205,120 L260,128 L315,108 L370,118 L425,95 L480,108 L535,82 L590,98 L645,72 L700,88" fill="none" stroke="#3A8C61" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <g fill="#94A09A" font-size="10.5" font-family="JetBrains Mono" text-anchor="middle">
              <text x="40" y="218">Juin</text><text x="95" y="218">Juil</text><text x="150" y="218">Août</text><text x="205" y="218">Sept</text><text x="260" y="218">Oct</text><text x="315" y="218">Nov</text><text x="370" y="218">Déc</text><text x="425" y="218">Janv</text><text x="480" y="218">Févr</text><text x="535" y="218">Mars</text><text x="590" y="218">Avr</text><text x="645" y="218" font-weight="700" fill="#0F1A14">Mai</text><text x="700" y="218" fill="#C2CAC6">Juin</text>
            </g>
          </svg>
        </div>

        <div class="col-span-4 bg-white rounded-2xl border border-ink-200 shadow-card p-5">
          <div class="mb-4">
            <h3 class="text-[15px] font-bold text-ink-900" id="donutTitle">Répartition</h3>
            <p class="text-[11.5px] text-ink-500 mt-0.5" id="donutSubtitle">—</p>
          </div>
          <div class="flex items-center gap-4">
            <svg viewBox="0 0 120 120" class="w-32 h-32 shrink-0">
              <circle cx="60" cy="60" r="44" stroke="#EEF2F0" stroke-width="20" fill="none"/>
              <circle cx="60" cy="60" r="44" stroke="#2D6F4D" stroke-width="20" fill="none" stroke-dasharray="118 276.5" transform="rotate(-90 60 60)"/>
              <circle cx="60" cy="60" r="44" stroke="#3A8C61" stroke-width="20" fill="none" stroke-dasharray="80 276.5" stroke-dashoffset="-118" transform="rotate(-90 60 60)"/>
              <circle cx="60" cy="60" r="44" stroke="#6FBE8E" stroke-width="20" fill="none" stroke-dasharray="50 276.5" stroke-dashoffset="-198" transform="rotate(-90 60 60)"/>
            </svg>
            <ul class="flex-1 space-y-1.5 text-[12.5px]" id="donutLegend"></ul>
          </div>
        </div>
      </div>

      <!-- Data table with filters -->
      <div class="bg-white rounded-2xl border border-ink-200 shadow-card overflow-hidden">
        <div class="flex items-center justify-between px-5 py-4 border-b border-ink-100">
          <div>
            <h3 class="text-[15px] font-bold text-ink-900">Saisies récentes</h3>
            <p class="text-[11.5px] text-ink-500 mt-0.5">Patients enregistrés ce mois</p>
          </div>
          <div class="flex items-center gap-2">
            <button class="h-9 px-3 rounded-xl border border-ink-200 text-[12px] font-semibold flex items-center gap-1.5 hover:bg-ink-50">01/05 → 25/05<svg viewBox="0 0 24 24" class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></button>
            <div class="flex p-1 bg-ink-50 rounded-xl border border-ink-200" data-seg-group>
              <button class="seg-btn is-active">Tous</button>
              <button class="seg-btn">Urbain</button>
              <button class="seg-btn">Rural</button>
            </div>
            <div class="flex p-1 bg-ink-50 rounded-xl border border-ink-200" data-seg-group>
              <button class="seg-btn is-active">F+H</button>
              <button class="seg-btn">F</button>
              <button class="seg-btn">H</button>
            </div>
          </div>
        </div>

        <table class="w-full text-[12.5px]">
          <thead class="text-[10.5px] uppercase tracking-wider text-ink-500 bg-ink-50/60">
            <tr id="tableHead"></tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-ink-100"></tbody>
        </table>
        <div class="flex items-center justify-between px-5 py-3 border-t border-ink-100 text-[12px] text-ink-500">
          <div>Affichage <span class="font-semibold text-ink-800 num">1–6</span> sur <span class="font-semibold text-ink-800 num" id="totalCount">28</span></div>
          <div class="flex items-center gap-1">
            <button class="w-8 h-8 rounded-lg border border-ink-200 text-ink-400" disabled>‹</button>
            <button class="w-8 h-8 rounded-lg border border-ink-200 bg-mint-100 text-mint-800 font-semibold">1</button>
            <button class="w-8 h-8 rounded-lg border border-ink-200 hover:bg-ink-50">2</button>
            <button class="w-8 h-8 rounded-lg border border-ink-200 hover:bg-ink-50">3</button>
            <button class="w-8 h-8 rounded-lg border border-ink-200 hover:bg-ink-50">›</button>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="app/chrome.js"></script>
<script>
  // Determine which program from ?p=
  const params = new URLSearchParams(location.search);
  const which = params.get('p') || 'nutrition';

  const PROGRAMS = {
    nutrition: {
      section: 'Programme · Nutrition',
      title: 'Surveillance nutritionnelle',
      subtitle: '482 enfants de moins de 5 ans pesés ce mois · taux de malnutrition aiguë 4,8 %',
      active: 'nutrition',
      breadcrumb: ['CSU Moussa Bnou Nouceir', 'Programmes', 'Nutrition'],
      kpis: [
        { label:'Enfants pesés', value:'482', delta:'+38', good:true, sub:'cible 500/mois' },
        { label:'Malnutrition aiguë (MAS+MAM)', value:'23', delta:'−4', good:true, sub:'4,8 % de la cohorte' },
        { label:'Anémie (Hb < 11)', value:'67', delta:'+9', good:false, sub:'dépistées' },
        { label:'Allaitement exclusif (0–6 m)', value:'71 %', delta:'+3 pt', good:true, sub:'enquête mensuelle' },
      ],
      trend: { title:'Enfants dépistés sur 12 mois', subtitle:'Surveillance & croissance' },
      donut: { title:'Statut nutritionnel', subtitle:'Cohorte 0–5 ans',
        legend: [
          { c:'#2D6F4D', label:'Normal', v:'82 %', n:'395' },
          { c:'#3A8C61', label:'À risque', v:'13 %', n:'64' },
          { c:'#6FBE8E', label:'Aiguë modérée', v:'4 %', n:'18' },
          { c:'#9CD2B2', label:'Aiguë sévère', v:'1 %', n:'5' },
        ] },
      headers: ['Patient', 'Âge', 'Sexe', 'Zone', 'P/T (z-score)', 'PB (mm)', 'Statut', ''],
      rows: [
        ['Khadija Bouazza',  '14 mois','F','Rural','-2,1','118','MAM','rappel'],
        ['Mehdi Idrissi',    '8 mois', 'M','Urbain','+0,2','135','Normal','suivi'],
        ['Yasmine El Khattabi','3 ans','F','Rural','-3,2','105','MAS','référé'],
        ['Anas Benhima',     '2 ans', 'M','Urbain','-0,8','128','Normal','suivi'],
        ['Lina Tahiri',      '5 mois','F','Urbain','-1,5','125','Risque','suivi'],
        ['Walid Sefrioui',   '4 ans', 'M','Rural','+0,5','141','Normal','suivi'],
      ],
      total: 28,
    },
    ist: {
      section: 'Programme · IST / SIDA',
      title: 'Lutte contre les IST',
      subtitle: 'Dépistage, prise en charge syndromique et conseil · taux de couverture 42 %',
      active: 'ist',
      breadcrumb: ['CSU Moussa Bnou Nouceir', 'Programmes', 'IST / SIDA'],
      kpis: [
        { label:'Cas dépistés', value:'58', delta:'+11', good:false, sub:'syndromique' },
        { label:'Tests VIH réalisés', value:'124', delta:'+22', good:true, sub:'cible 150/mois' },
        { label:'Femmes enceintes testées', value:'196', delta:'100 %', good:true, sub:'CPN' },
        { label:'Référés ELRH', value:'7', delta:'+2', good:false, sub:'cas confirmés' },
      ],
      trend: { title:'Tests VIH sur 12 mois', subtitle:'Dépistage volontaire' },
      donut: { title:'Diagnostics syndromiques', subtitle:'58 cas ce mois',
        legend: [
          { c:'#2D6F4D', label:'Écoulement urétral', v:'40 %', n:'23' },
          { c:'#3A8C61', label:'Pertes vaginales', v:'31 %', n:'18' },
          { c:'#6FBE8E', label:'Ulcération génitale', v:'17 %', n:'10' },
          { c:'#9CD2B2', label:'Autres', v:'12 %', n:'7' },
        ] },
      headers: ['Patient', 'Âge', 'Sexe', 'Zone', 'Syndrome', 'Test', 'Statut', ''],
      rows: [
        ['M.A. (anonyme)',   '28','M','Urbain','Écoulement urétral','Négatif','Traité','suivi'],
        ['S.B. (anonyme)',   '34','F','Rural','Pertes vaginales','—','Traitée','suivi'],
        ['Y.K. (anonyme)',   '22','M','Urbain','Ulcération','Positif','Référé ELRH','rappel'],
        ['R.E. (anonyme)',   '31','F','Urbain','Écoulement / urétrite','Négatif','Traitée','suivi'],
        ['I.L. (anonyme)',   '26','M','Rural','Pertes','—','Traité','suivi'],
        ['A.O. (anonyme)',   '38','F','Urbain','Bubon inguinal','Positif','Référée ELRH','rappel'],
      ],
      total: 58,
    },
    cme: {
      section: 'Programme · CME < 5 ans',
      title: 'Consultations curatives < 5 ans',
      subtitle: 'Prise en charge intégrée des maladies de l\'enfant (PCIME) · 612 consultations ce mois',
      active: 'cme',
      breadcrumb: ['CSU Moussa Bnou Nouceir', 'Programmes', 'CME < 5 ans'],
      kpis: [
        { label:'Consultations', value:'612', delta:'+47', good:true, sub:'cible 600/mois' },
        { label:'IRA', value:'241', delta:'+32', good:false, sub:'40 % du total' },
        { label:'Diarrhée', value:'118', delta:'+15', good:false, sub:'pic saisonnier' },
        { label:'Référés CHP', value:'14', delta:'+3', good:false, sub:'cas sévères' },
      ],
      trend: { title:'Consultations sur 12 mois', subtitle:'PCIME · enfants < 5 ans' },
      donut: { title:'Motifs de consultation', subtitle:'612 cas ce mois',
        legend: [
          { c:'#2D6F4D', label:'IRA', v:'40 %', n:'241' },
          { c:'#3A8C61', label:'Diarrhée', v:'19 %', n:'118' },
          { c:'#6FBE8E', label:'Fièvre / paludisme', v:'15 %', n:'92' },
          { c:'#9CD2B2', label:'Autres', v:'26 %', n:'161' },
        ] },
      headers: ['Patient', 'Âge', 'Sexe', 'Zone', 'Diagnostic', 'Traitement', 'Suivi', ''],
      rows: [
        ['Sara Idrissi',     '18 mois','F','Urbain','IRA basse',  'Amoxicilline','J+3','suivi'],
        ['Adam Benhima',     '9 mois', 'M','Rural','Diarrhée aiguë','SRO + Zinc','J+2','suivi'],
        ['Imane Cherkaoui',  '3 ans',  'F','Urbain','Fièvre isolée','Paracétamol','J+1','suivi'],
        ['Hamza El Fassi',   '2 ans',  'M','Rural','IRA haute','Amoxicilline','J+5','suivi'],
        ['Lina Tahiri',      '5 mois', 'F','Urbain','Bronchiolite','Référée CHP','—','urgent'],
        ['Younès Alami',     '4 ans',  'M','Urbain','Otite moyenne','Amoxicilline','J+7','suivi'],
      ],
      total: 612,
    },
  };

  const cfg = PROGRAMS[which] || PROGRAMS.nutrition;
  document.title = 'Sehha — ' + cfg.title;
  document.getElementById('pgSection').textContent = cfg.section;
  document.getElementById('pgTitle').textContent = cfg.title;
  document.getElementById('pgSubtitle').textContent = cfg.subtitle;
  document.getElementById('trendTitle').textContent = cfg.trend.title;
  document.getElementById('trendSubtitle').textContent = cfg.trend.subtitle;
  document.getElementById('donutTitle').textContent = cfg.donut.title;
  document.getElementById('donutSubtitle').textContent = cfg.donut.subtitle;

  document.getElementById('pgKpis').innerHTML = cfg.kpis.map(k => `
    <div class="bg-white rounded-2xl border border-ink-200 shadow-card p-5">
      <div class="text-[12px] text-ink-600 font-medium mb-2">${k.label}</div>
      <div class="flex items-end gap-2"><div class="text-[28px] font-bold num leading-none">${k.value}</div><span class="text-[11px] font-bold ${k.good ? 'text-mint-700 bg-mint-100' : 'text-amber-700 bg-amber-100'} px-1.5 py-0.5 rounded-md mb-1">${k.delta}</span></div>
      <div class="text-[11px] text-ink-500 mt-2">${k.sub}</div>
    </div>
  `).join('');

  document.getElementById('donutLegend').innerHTML = cfg.donut.legend.map(l => `
    <li class="flex items-center justify-between gap-3">
      <span class="inline-flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-sm" style="background:${l.c}"></span>${l.label}</span>
      <span class="num font-semibold">${l.v}</span>
      <span class="text-ink-500 num text-[11px]">${l.n}</span>
    </li>
  `).join('');

  document.getElementById('tableHead').innerHTML = cfg.headers.map((h, i) =>
    `<th class="text-${i === cfg.headers.length - 1 ? 'right' : 'left'} font-semibold ${i === 0 ? 'px-5' : i === cfg.headers.length-1 ? 'px-5' : 'px-3'} py-2.5">${h}</th>`
  ).join('');

  const statusBadge = (s) => {
    const map = { 'MAS': 'text-rose-700 bg-rose-100', 'MAM': 'text-amber-700 bg-amber-100', 'Normal': 'text-mint-700 bg-mint-100', 'Risque': 'text-amber-700 bg-amber-100',
      'Traité': 'text-mint-700 bg-mint-100', 'Traitée': 'text-mint-700 bg-mint-100', 'Référé ELRH': 'text-rose-700 bg-rose-100', 'Référée ELRH': 'text-rose-700 bg-rose-100', 'Référée CHP':'text-rose-700 bg-rose-100' };
    return map[s] || 'text-ink-700 bg-ink-100';
  };
  const actionBadge = (a) => {
    const map = { 'rappel': '<button class="text-[11.5px] font-semibold text-mint-700 hover:underline">SMS rappel →</button>',
      'suivi': '<a href="Patient.html" class="text-[11.5px] font-semibold text-mint-700 hover:underline">Voir dossier →</a>',
      'référé': '<button class="text-[11.5px] font-semibold text-rose-700 hover:underline">Lettre de référence →</button>',
      'urgent': '<button class="text-[11.5px] font-bold text-rose-700">Urgence →</button>' };
    return map[a] || '';
  };
  document.getElementById('tableBody').innerHTML = cfg.rows.map(r => `
    <tr class="hover:bg-ink-50/60">
      <td class="px-5 py-3">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-full bg-mint-100 grid place-items-center text-mint-800 font-bold text-[11px]">${r[0].split(' ').map(x=>x[0]).slice(0,2).join('')}</div>
          <div class="font-semibold text-ink-900">${r[0]}</div>
        </div>
      </td>
      <td class="px-3 py-3 num">${r[1]}</td>
      <td class="px-3 py-3">${r[2]}</td>
      <td class="px-3 py-3">${r[3]}</td>
      <td class="px-3 py-3 font-semibold">${r[4]}</td>
      <td class="px-3 py-3">${r[5]}</td>
      <td class="px-3 py-3"><span class="text-[10.5px] font-bold ${statusBadge(r[6])} px-1.5 py-0.5 rounded-md">${r[6]}</span></td>
      <td class="px-5 py-3 text-right">${actionBadge(r[7])}</td>
    </tr>
  `).join('');
  document.getElementById('totalCount').textContent = cfg.total;

  Chrome.mount({ active: cfg.active, breadcrumb: cfg.breadcrumb });
</script>

</body>
</html>
